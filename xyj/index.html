<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1677ff"><meta name="description" content="扫机子二维码，跳过洗衣 App，直接打开支付宝小程序选套餐"><title>校园洗衣设备入口</title><style>:root{--blue:#1677ff;--blue-soft:#4f9cff;--ink:#17233a;--muted:#65728a;--line:#dbe3ee;--card:#ffffff;--ok:#16794b;--ok-bg:#edf9f1;--err:#b42318;--err-bg:#fdecea;--warn:#8a5a00;--warn-bg:#fff8e6;--radius:18px;color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body,html{margin:0}body{min-height:100vh;color:var(--ink);background:radial-gradient(1200px 480px at 10% -10%,rgba(22,119,255,.16),transparent 55%),radial-gradient(900px 420px at 110% 0,rgba(79,156,255,.18),transparent 50%),#eef3f8}main{width:min(560px,calc(100% - 32px));margin:0 auto;padding:36px 0 56px}header{margin-bottom:22px}.badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:4px 10px;border-radius:999px;background:rgba(22,119,255,.1);color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.04em}h1{margin:0 0 8px;font-size:clamp(26px, 6vw, 32px);letter-spacing:-.04em;line-height:1.15}.lead{margin:0;color:var(--muted);line-height:1.65;font-size:15px}section{background:var(--card);border:1px solid rgba(225,231,239,.95);border-radius:var(--radius);padding:22px;box-shadow:0 18px 40px rgba(23,35,58,.08)}label{display:block;margin-bottom:8px;font-size:14px;font-weight:650;color:#43516a}textarea{width:100%;min-height:118px;padding:14px;border:1px solid #ccd6e4;border-radius:12px;resize:vertical;font:inherit;line-height:1.55;background:#fbfcfe}textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(22,119,255,.14);background:#fff}.row{display:flex;gap:10px;align-items:stretch;margin-top:14px}button{min-height:46px;border:0;border-radius:12px;padding:0 16px;font:inherit;font-weight:700;cursor:pointer}#open{flex:1.4;background:linear-gradient(180deg,var(--blue-soft),var(--blue));color:#fff;box-shadow:0 8px 18px rgba(22,119,255,.28)}#open:disabled{background:#b7c3d4;box-shadow:none;cursor:default}#clear,#copy,#pick-image,#scan,#stop-scan{background:#eef2f7;color:#43516a}#scan{flex:1}#qr-file{display:none}.scanner{position:relative;overflow:hidden;margin-top:14px;border-radius:16px;background:#08111d;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.scanner[hidden]{display:none}video{display:block;width:100%;height:min(58vw,360px);object-fit:cover;background:#000}.scan-mask{pointer-events:none;position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,17,29,.38),transparent 18%,transparent 82%,rgba(8,17,29,.42)),linear-gradient(to right,rgba(8,17,29,.28),transparent 18%,transparent 82%,rgba(8,17,29,.28))}.scan-frame{pointer-events:none;position:absolute;top:50%;left:50%;width:min(68%,240px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 0 0 999px rgba(8,17,29,.28)}.scan-corners::after,.scan-corners::before,.scan-frame::after,.scan-frame::before{content:"";position:absolute;width:28px;height:28px;border:3px solid #67b0ff}.scan-frame::before{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:14px}.scan-frame::after{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:14px}.scan-corners::before{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:14px}.scan-corners::after{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:14px}.scan-line{pointer-events:none;position:absolute;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,#7ec0ff,transparent);box-shadow:0 0 18px #4f9cff;animation:scan-move 2.1s ease-in-out infinite}@keyframes scan-move{0%,100%{top:18%;opacity:.35}50%{top:78%;opacity:1}}.scanner-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;color:#d7e3f4;font-size:13px}.scanner-bar p{margin:0;line-height:1.45}.scanner-actions{display:flex;gap:8px;flex-shrink:0}#pick-image,#stop-scan{min-height:38px;background:#fff}.link-box,.result{margin-top:16px;padding:14px;border-radius:14px;font-size:14px;line-height:1.65;overflow-wrap:anywhere}.result{background:#f6f8fb;color:var(--muted)}.ok{color:var(--ok);background:var(--ok-bg)}.error{color:var(--err);background:var(--err-bg)}.warn{color:var(--warn);background:var(--warn-bg)}.link-box{display:none;background:#f7f9fc;border:1px solid var(--line)}.link-box.show{display:block}.link-box h2{margin:0 0 8px;font-size:14px;font-weight:750}.link-box p{margin:0 0 10px;color:var(--muted)}#jump-link{display:block;margin:0 0 12px;padding:12px;border-radius:10px;background:#fff;border:1px solid #e5ebf3;color:#1d4ed8;font-size:13px;line-height:1.55;word-break:break-all}.link-actions{display:flex;gap:8px}.link-actions a,.link-actions button{flex:1;display:inline-flex;align-items:center;justify-content:center;min-height:42px;border-radius:12px;text-decoration:none;font-weight:700}#retry{background:linear-gradient(180deg,var(--blue-soft),var(--blue));color:#fff}.hint{margin:16px 0 0;color:var(--muted);font-size:13px}@media (max-width:520px){.row{flex-wrap:wrap}#open,#scan{flex:1 1 calc(50% - 5px)}#clear{flex:1 1 100%}.scanner-bar{flex-direction:column;align-items:stretch}}</style></head><body><main><header><div class="badge">跳过洗衣 App</div><h1>校园洗衣设备入口</h1><p class="lead">扫机子上的码，或粘贴二维码链接。识别成功后会自动跳进支付宝选套餐；跳不过去也能复制转换后的链接。</p></header><section><label for="source">设备二维码链接或内容</label><textarea id="source" autocomplete="off" placeholder="例如：https://h5.qiekj.com/skip?NQT=DEVICE_TOKEN"></textarea><div class="row"><button id="scan" type="button">扫码识别</button> <button id="open" type="button" disabled>打开支付宝小程序</button> <button id="clear" type="button">清空</button></div><input id="qr-file" type="file" accept="image/*" capture="environment"><div id="scanner" class="scanner" hidden><video id="preview" playsinline muted></video><div class="scan-mask"></div><div class="scan-frame"><span class="scan-corners"></span><span class="scan-line"></span></div><div class="scanner-bar"><p>把机子二维码放进取景框，识别成功会自动跳转。</p><div class="scanner-actions"><button id="pick-image" type="button">选图片</button> <button id="stop-scan" type="button">停止扫码</button></div></div></div><div id="result" class="result" aria-live="polite">等待设备参数</div><div id="link-box" class="link-box"><h2>转换后的支付宝链接</h2><p>自动跳转失败时，点下面的链接，或复制后在手机里打开。</p><a id="jump-link" href="#"></a><div class="link-actions"><button id="copy" type="button">复制链接</button> <a id="retry" href="#">再试一次</a></div></div><p class="hint">需要在安装支付宝的手机浏览器中打开。网页本身不登录、不支付；账号和付款都在支付宝小程序里完成。</p></section></main><script>const source=document.querySelector("#source"),scan=document.querySelector("#scan"),open=document.querySelector("#open"),clear=document.querySelector("#clear"),qrFile=document.querySelector("#qr-file"),scanner=document.querySelector("#scanner"),preview=document.querySelector("#preview"),stopScan=document.querySelector("#stop-scan"),pickImage=document.querySelector("#pick-image"),result=document.querySelector("#result"),linkBox=document.querySelector("#link-box"),jumpLink=document.querySelector("#jump-link"),retry=document.querySelector("#retry"),copy=document.querySelector("#copy");let deviceParam="",jumpUri="",stream=null,scanFrame=0,lastAutoJump="";function valueFromRaw(e,r){try{const t=new URL(e).searchParams.get(r);if(t)return t}catch(e){}const t=e.match(new RegExp("(?:^|[?&])"+r+"=([^&\\s]+)","i"));return t?decodeURIComponent(t[1]):""}function parseDevice(e){const r=e.trim();if(!r)return"";for(const e of["NQT","IMEI","SN"]){const t=valueFromRaw(r,e);if(t)return e+"="+t}return""}function buildJumpUri(e){return"alipays://platformapi/startapp?appId=2018072460764274&page=pages/skipNew/skipNew&query="+encodeURIComponent(e+"&fromApp=1&&keepUsing=1")}function setResult(e,r){result.className="result"+(e?" "+e:""),result.textContent=r}function showJumpLink(e){jumpUri=e,jumpLink.href=e,jumpLink.textContent=e,retry.href=e,linkBox.classList.add("show")}function hideJumpLink(){jumpUri="",jumpLink.removeAttribute("href"),jumpLink.textContent="",retry.removeAttribute("href"),linkBox.classList.remove("show")}function refresh(){if(deviceParam=parseDevice(source.value),open.disabled=!deviceParam,deviceParam){const e=buildJumpUri(deviceParam);setResult("ok","已识别设备参数："+deviceParam),showJumpLink(e)}else hideJumpLink(),setResult(source.value.trim()?"error":"",source.value.trim()?"未识别 NQT、IMEI 或 SN 参数":"等待设备参数")}function stopScanner(){cancelAnimationFrame(scanFrame),scanFrame=0,stream&&stream.getTracks().forEach((e=>e.stop())),stream=null,preview.srcObject=null,scanner.hidden=!0}function openAlipay(e,r){showJumpLink(e),setResult("ok",r),window.location.href=e}function useScanValue(e){source.value=e,refresh(),deviceParam&&(stopScanner(),jumpUri&&jumpUri!==lastAutoJump&&(lastAutoJump=jumpUri,openAlipay(jumpUri,"已识别，正在打开支付宝小程序。若没有跳转，点下面的链接。")))}async function startCameraScan(){if("BarcodeDetector"in window&&navigator.mediaDevices?.getUserMedia)try{const e=new BarcodeDetector({formats:["qr_code"]});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:!1}),preview.srcObject=stream,scanner.hidden=!1,await preview.play();const r=async()=>{if(stream){try{const r=await e.detect(preview);if(r[0]?.rawValue)return void useScanValue(r[0].rawValue)}catch(e){}scanFrame=requestAnimationFrame(r)}};r()}catch(e){stopScanner(),qrFile.click()}else qrFile.click()}async function scanImage(e){if(e)if("BarcodeDetector"in window)try{const r=await createImageBitmap(e),t=new BarcodeDetector({formats:["qr_code"]}),a=await t.detect(r);if(r.close(),!a[0]?.rawValue)throw new Error("not found");useScanValue(a[0].rawValue)}catch(e){setResult("error","未在图片中识别到二维码")}else setResult("error","当前浏览器不支持网页扫码，请使用最新版 Chrome 或 Edge")}source.addEventListener("input",refresh),scan.addEventListener("click",startCameraScan),stopScan.addEventListener("click",stopScanner),pickImage.addEventListener("click",(()=>qrFile.click())),qrFile.addEventListener("change",(()=>{scanImage(qrFile.files[0]),qrFile.value=""})),clear.addEventListener("click",(()=>{stopScanner(),source.value="",lastAutoJump="",refresh(),source.focus()})),open.addEventListener("click",(()=>{jumpUri&&(lastAutoJump=jumpUri,openAlipay(jumpUri,"正在打开支付宝小程序。若没有跳转，点下面的链接或复制后再打开。"))})),copy.addEventListener("click",(async()=>{if(jumpUri)try{await navigator.clipboard.writeText(jumpUri),setResult("ok","链接已复制。若自动跳转失败，粘贴到手机浏览器打开。")}catch(e){setResult("warn","复制失败，请长按下方链接手动复制。")}}))</script></body></html>
