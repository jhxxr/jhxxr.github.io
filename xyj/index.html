<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1677ff"><title>校园洗衣设备入口</title><style>:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f6fa;color:#17233a}main{width:min(560px,calc(100% - 32px));margin:0 auto;padding:42px 0 56px}header{margin-bottom:24px}h1{margin:0 0 8px;font-size:28px;letter-spacing:0}p{margin:0;color:#65728a;line-height:1.6}section{background:#fff;border:1px solid #e1e7ef;border-radius:8px;padding:22px;box-shadow:0 8px 24px rgba(32,54,84,.06)}label{display:block;margin-bottom:8px;font-size:14px;font-weight:600;color:#43516a}textarea{width:100%;min-height:112px;padding:12px;border:1px solid #ccd6e4;border-radius:6px;resize:vertical;font:inherit;line-height:1.5}textarea:focus{outline:2px solid rgba(22,119,255,.2);border-color:#1677ff}.row{display:flex;gap:10px;align-items:center;margin-top:14px}button{min-height:44px;border:0;border-radius:6px;padding:0 18px;font:inherit;font-weight:600;cursor:pointer}#open{flex:1;background:#1677ff;color:#fff}#open:disabled{background:#a9b7ca;cursor:default}#clear,#scan{background:#eef2f7;color:#43516a}#scan{flex:1}#qr-file{display:none}.scanner{margin-top:14px;padding:12px;border:1px solid #dbe3ee;border-radius:6px;background:#0e1726}.scanner[hidden]{display:none}video{display:block;width:100%;max-height:360px;border-radius:4px;object-fit:cover}.scanner-actions{display:flex;justify-content:flex-end;margin-top:10px}#stop-scan{min-height:38px;background:#fff;color:#43516a}.result{margin-top:18px;padding:12px;background:#f6f8fb;border-radius:6px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}.ok{color:#16794b}.error{color:#b42318}.hint{margin-top:16px;font-size:13px}</style></head><body><main><header><h1>校园洗衣设备入口</h1><p>粘贴设备二维码链接，直接打开支付宝小程序选择套餐。</p></header><section><label for="source">设备二维码链接或内容</label><textarea id="source" autocomplete="off" placeholder="例如：https://h5.qiekj.com/skip?NQT=DEVICE_TOKEN"></textarea><div class="row"><button id="scan" type="button">扫码识别</button> <button id="open" type="button" disabled>打开支付宝小程序</button> <button id="clear" type="button">清空</button></div><input id="qr-file" type="file" accept="image/*" capture="environment"><div id="scanner" class="scanner" hidden><video id="preview" playsinline muted></video><div class="scanner-actions"><button id="stop-scan" type="button">停止扫码</button></div></div><div id="result" class="result" aria-live="polite">等待设备参数</div><p class="hint">需要在安装支付宝的手机浏览器中打开。网页本身不要求登录；支付宝内的账号和支付状态由小程序处理。</p></section></main><script>const source=document.querySelector("#source"),scan=document.querySelector("#scan"),open=document.querySelector("#open"),clear=document.querySelector("#clear"),qrFile=document.querySelector("#qr-file"),scanner=document.querySelector("#scanner"),preview=document.querySelector("#preview"),stopScan=document.querySelector("#stop-scan"),result=document.querySelector("#result");let deviceParam="",stream=null,scanFrame=0;function valueFromRaw(e,r){try{const a=new URL(e).searchParams.get(r);if(a)return a}catch(e){}const a=e.match(new RegExp("(?:^|[?&])"+r+"=([^&\\s]+)","i"));return a?decodeURIComponent(a[1]):""}function parseDevice(e){const r=e.trim();if(!r)return"";for(const e of["NQT","IMEI","SN"]){const a=valueFromRaw(r,e);if(a)return e+"="+a}return""}function refresh(){deviceParam=parseDevice(source.value),open.disabled=!deviceParam,deviceParam?(result.className="result ok",result.textContent="已识别设备参数："+deviceParam):(result.className="result error",result.textContent=source.value.trim()?"未识别 NQT、IMEI 或 SN 参数":"等待设备参数")}function stopScanner(){cancelAnimationFrame(scanFrame),scanFrame=0,stream&&stream.getTracks().forEach((e=>e.stop())),stream=null,preview.srcObject=null,scanner.hidden=!0}function useScanValue(e){source.value=e,refresh(),deviceParam&&stopScanner()}async function startCameraScan(){if("BarcodeDetector"in window&&navigator.mediaDevices?.getUserMedia)try{const e=new BarcodeDetector({formats:["qr_code"]});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:!1}),preview.srcObject=stream,scanner.hidden=!1,await preview.play();const r=async()=>{if(stream){try{const r=await e.detect(preview);if(r[0]?.rawValue)return void useScanValue(r[0].rawValue)}catch(e){}scanFrame=requestAnimationFrame(r)}};r()}catch(e){stopScanner(),qrFile.click()}else qrFile.click()}async function scanImage(e){if(e){if(!("BarcodeDetector"in window))return result.className="result error",void(result.textContent="当前浏览器不支持网页扫码，请使用最新版 Chrome 或 Edge");try{const r=await createImageBitmap(e),a=new BarcodeDetector({formats:["qr_code"]}),t=await a.detect(r);if(r.close(),!t[0]?.rawValue)throw new Error("not found");useScanValue(t[0].rawValue)}catch(e){result.className="result error",result.textContent="未在图片中识别到二维码"}}}source.addEventListener("input",refresh),scan.addEventListener("click",startCameraScan),stopScan.addEventListener("click",stopScanner),qrFile.addEventListener("change",(()=>{scanImage(qrFile.files[0]),qrFile.value=""})),clear.addEventListener("click",(()=>{stopScanner(),source.value="",refresh(),source.focus()})),open.addEventListener("click",(()=>{if(!deviceParam)return;const e="alipays://platformapi/startapp?appId=2018072460764274&page=pages/skipNew/skipNew&query="+encodeURIComponent(deviceParam+"&fromApp=1&&keepUsing=1");window.location.href=e}))</script></body></html>
